[project]
name = "voicelab"
version = "0.1.0"
description = "An internal benchmarking platform for speech AI research"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "streamlit>=1.38,<2",
    "requests>=2.32,<3",
    "torch>=2.4,<3",
    "transformers>=4.44,<5",
    "librosa>=0.10,<1",
    "soundfile>=0.12,<1",
    "jiwer>=3.0,<4",
    "mlflow>=2.16,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<2",
    "datacollective>=0.6.4",
    "sqlalchemy>=2.0,<2.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that download models or run real inference",
]
