services:
  api:
    build: .
    command: uv run uvicorn voicelab.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      # Mount project source so code changes are reflected without rebuild
      - .:/app
      # Persist dataset cache and MLflow data across container restarts
      - voicelab-data:/app/data
      - voicelab-mlruns:/app/mlruns
      - voicelab-mlflow-db:/app/db
    env_file: .env
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/db/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/app/mlruns
      - VOICELAB_DATA_DIR=/app/data

  dashboard:
    build: .
    command: uv run streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - VOICELAB_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  voicelab-data:
  voicelab-mlruns:
  voicelab-mlflow-db:
